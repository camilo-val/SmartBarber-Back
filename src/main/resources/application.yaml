spring:
  application:
    name: smart_barber

  r2dbc:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    pool:
      enabled: true
      initial-size: 5
      max-size: 20

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

logging:
  level:
    org.springframework.data.r2dbc: DEBUG
    org.springframework.r2dbc: DEBUG

payment:
  key: ${PAYMENT_KEY}
  # Legacy response timeout remains the fallback for existing deployments.
  timeout: ${PAYMENT_TIMEOUT:30}
  # Operational defaults: 10s to send, 30s to receive a result, 300s to retain it for a reconnect.
  publication-timeout: ${PAYMENT_PUBLICATION_TIMEOUT:10}
  response-timeout: ${PAYMENT_RESPONSE_TIMEOUT:${PAYMENT_TIMEOUT:30}}
  response-retention-ttl: ${PAYMENT_RESPONSE_RETENTION_TTL:300}

server:
  port: ${PORT:8080}

firebase:
  credentials: ${FIREBASE_CREDENTIALS}

service:
  payment-service: ${PAYMENT_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health